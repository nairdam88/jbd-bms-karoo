name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, e.g. 0.2.2"
        required: true
      release_notes:
        description: "Release notes"
        required: true
        default: "Bug fixes and improvements."

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Bump version
        run: |
          set -e
          CURRENT_CODE=$(grep '^APP_VERSION_CODE=' gradle.properties | cut -d= -f2)
          NEW_CODE=$((CURRENT_CODE + 1))
          sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$NEW_CODE/" gradle.properties
          sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=${{ inputs.version }}/" gradle.properties
          git config user.name "nairdam88"
          git config user.email "nairdam88@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release ${{ inputs.version }}"
          git push

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Test and build
        env:
          KEYSTORE_FILE: release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: JBD BMS v${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/manifest.json
